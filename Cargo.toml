[package]
name = "vinca"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/katalyxbio/vinca"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
crossbeam-channel = "0.5.15"
env_logger = "0.11.10"
indicatif = "0.18.4"
log = "0.4.29"
noodles = { version = "0.109.0", features = ["bam", "sam", "bgzf", "core"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
